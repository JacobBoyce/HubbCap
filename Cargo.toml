[package]
name = "hubbcap"
version = "0.1.0"
edition = "2024"
description = "HubbCap: version control that gets out of your way"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
fastcdc = "5.0.0"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.0"
zstd = "0.14.3"

[dev-dependencies]
proptest = "1.12.0"

[[bin]]
name = "cap"
path = "src/main.rs"
